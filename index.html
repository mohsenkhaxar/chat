<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC STUN Video Chat (Custom ID)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    input, textarea, button {
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      padding: 9px 12px;
    }
    input, textarea {
      background: var(--panel-2);
      color: var(--text);
    }
    input[type="text"] { min-width: 180px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: #334155; }
    button.success { background: #16a34a; }
    button.danger { background: #dc2626; }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .video-box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
      border-radius: 8px;
      object-fit: cover;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .chat-messages, .log-box {
      height: 210px;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .log-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }
    .msg { margin-bottom: 8px; }
    .msg .meta { color: var(--muted); font-size: 0.76rem; }
    .status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 8px;
    }
    details { margin-top: 8px; }
    textarea { width: 100%; min-height: 84px; font-family: monospace; font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="margin: 0 0 12px;">WebRTC STUN Video Chat</h2>
      <div class="row">
        <div>
          <label for="my-id-input">My ID (editable)</label>
          <div class="row">
            <input id="my-id-input" type="text" placeholder="e.g. SARA-01" maxlength="32" />
            <button id="set-id-btn" class="secondary" type="button">Set ID</button>
            <button id="random-id-btn" class="secondary" type="button">Random</button>
          </div>
        </div>

        <div>
          <label for="peer-id-input">Peer ID</label>
          <div class="row">
            <input id="peer-id-input" type="text" placeholder="Enter remote Peer ID" maxlength="32" />
            <button id="start-call-btn" class="success" type="button">Start Video Chat</button>
            <button id="hangup-btn" class="danger" type="button">Hang Up</button>
          </div>
        </div>
      </div>

      <div class="status" id="status-line">Status: Idle (STUN-only, no TURN)</div>

      <details>
        <summary style="cursor:pointer; color: var(--muted); font-size: 0.85rem;">
          Manual SDP Signaling Fallback (when peers cannot share BroadcastChannel)
        </summary>
        <div style="margin-top: 8px;" class="row">
          <button id="create-offer-btn" class="secondary" type="button">Generate Offer JSON</button>
          <button id="apply-signal-btn" class="secondary" type="button">Apply Signal JSON</button>
        </div>
        <div style="margin-top: 8px;">
          <textarea id="signal-box" placeholder="Offer/Answer JSON appears here or paste remote Offer/Answer JSON to apply..."></textarea>
        </div>
      </details>
    </div>

    <div class="card">
      <div class="videos">
        <div class="video-box">
          <label>Local Video (Me)</label>
          <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
          <label>Remote Video (Peer)</label>
          <video id="remote-video" autoplay playsinline></video>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3 style="margin: 0 0 8px;">Text Chat</h3>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="row" style="margin-top: 8px;">
          <input id="chat-input" type="text" placeholder="Type a message..." style="flex: 1;" />
          <button id="send-chat-btn" type="button">Send</button>
        </div>
      </div>

      <div class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
          <h3 style="margin: 0;">Event Log</h3>
          <button id="clear-log-btn" class="secondary" type="button" style="padding: 5px 10px; font-size: 0.8rem;">Clear</button>
        </div>
        <div id="log-box" class="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    };

    const STORAGE_KEY = "webrtc_custom_my_id_v1";
    const CHANNEL_NAME = "webrtc-stun-id-signaling-v1";

    const myIdInput = document.getElementById("my-id-input");
    const setIdBtn = document.getElementById("set-id-btn");
    const randomIdBtn = document.getElementById("random-id-btn");
    const peerIdInput = document.getElementById("peer-id-input");
    const startCallBtn = document.getElementById("start-call-btn");
    const hangupBtn = document.getElementById("hangup-btn");
    const createOfferBtn = document.getElementById("create-offer-btn");
    const applySignalBtn = document.getElementById("apply-signal-btn");
    const signalBox = document.getElementById("signal-box");
    const localVideo = document.getElementById("local-video");
    const remoteVideo = document.getElementById("remote-video");
    const chatMessages = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendChatBtn = document.getElementById("send-chat-btn");
    const logBox = document.getElementById("log-box");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const statusLine = document.getElementById("status-line");

    let myId = "";
    let localStream = null;
    let pc = null;
    let dataChannel = null;
    let signalChannel = null;
    let pendingCandidates = [];

    function log(msg) {
      const now = new Date();
      const ts = now.toTimeString().split(" ")[0] + "." + String(now.getMilliseconds()).padStart(3, "0");
      logBox.textContent += `[${ts}] ${msg}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text) {
      statusLine.textContent = `Status: ${text}`;
    }

    function appendChat(sender, text) {
      const div = document.createElement("div");
      div.className = "msg";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${sender} · ${new Date().toLocaleTimeString()}`;
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(meta);
      div.appendChild(body);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sanitizeId(raw) {
      return (raw || "")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9_-]/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 32);
    }

    function generateRandomId() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "PEER-";
      for (let i = 0; i < 6; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
      }
      return out;
    }

    function setupSignalingChannel() {
      if (signalChannel) {
        signalChannel.close();
      }
      signalChannel = new BroadcastChannel(CHANNEL_NAME);
      signalChannel.onmessage = async (event) => {
        const payload = event.data;
        if (!payload || payload.to !== myId) return;
        await handleIncomingSignal(payload);
      };
      signalChannel.postMessage({ type: "register", from: myId, at: Date.now() });
      log(`Registered My ID "${myId}" on BroadcastChannel.`);
    }

    function applyMyId(rawValue, sourceLabel = "manual") {
      const cleaned = sanitizeId(rawValue);
      if (!cleaned) {
        log("Rejected empty/invalid ID. Use letters, numbers, '-' or '_'.");
        myIdInput.value = myId;
        return false;
      }
      const previous = myId;
      myId = cleaned;
      myIdInput.value = myId;
      try {
        localStorage.setItem(STORAGE_KEY, myId);
      } catch (_) {}
      setupSignalingChannel();
      if (previous && previous !== myId) {
        log(`My ID changed (${sourceLabel}): "${previous}" -> "${myId}".`);
      } else {
        log(`My ID set (${sourceLabel}): "${myId}".`);
      }
      setStatus(`Ready as "${myId}"`);
      return true;
    }

    async function ensureLocalMedia() {
      if (localStream) return localStream;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("getUserMedia unavailable (requires HTTPS or localhost).");
      }
      log("Requesting camera and microphone...");
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      log(`Local media ready (video tracks: ${localStream.getVideoTracks().length}, audio tracks: ${localStream.getAudioTracks().length}).`);
      return localStream;
    }

    function bindDataChannel(dc) {
      dataChannel = dc;
      dc.onopen = () => {
        log("DataChannel open — text chat ready.");
        setStatus(`Connected as "${myId}"`);
      };
      dc.onclose = () => log("DataChannel closed.");
      dc.onerror = (e) => log(`DataChannel error: ${e.message || "unknown"}`);
      dc.onmessage = (event) => {
        appendChat("Peer", String(event.data));
      };
    }

    function createPeerConnection(targetPeerId) {
      if (pc) {
        pc.close();
      }
      pendingCandidates = [];
      pc = new RTCPeerConnection(RTC_CONFIG);

      if (localStream) {
        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }
      }

      pc.ontrack = (event) => {
        log(`Remote track received (${event.track.kind}).`);
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        } else {
          if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
          remoteVideo.srcObject.addTrack(event.track);
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && targetPeerId && signalChannel) {
          signalChannel.postMessage({
            type: "ice",
            from: myId,
            to: targetPeerId,
            candidate: event.candidate.toJSON()
          });
        }
      };

      pc.onicegatheringstatechange = () => {
        log(`ICE gathering state: ${pc.iceGatheringState}`);
      };

      pc.oniceconnectionstatechange = () => {
        log(`ICE connection state: ${pc.iceConnectionState}`);
      };

      pc.onconnectionstatechange = () => {
        log(`Peer connection state: ${pc.connectionState}`);
        setStatus(`Connection: ${pc.connectionState}`);
      };

      return pc;
    }

    async function flushPendingCandidates() {
      if (!pc || !pc.remoteDescription) return;
      while (pendingCandidates.length > 0) {
        const c = pendingCandidates.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        } catch (err) {
          log(`Failed adding buffered ICE candidate: ${err.message}`);
        }
      }
    }

    async function handleIncomingSignal(payload) {
      const remoteId = sanitizeId(payload.from);
      if (remoteId && !peerIdInput.value.trim()) {
        peerIdInput.value = remoteId;
      }

      if (payload.type === "offer") {
        log(`Incoming offer from "${remoteId}".`);
        await ensureLocalMedia();
        const conn = createPeerConnection(remoteId);
        conn.ondatachannel = (event) => bindDataChannel(event.channel);

        await conn.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        await flushPendingCandidates();

        const answer = await conn.createAnswer();
        await conn.setLocalDescription(answer);

        signalChannel.postMessage({
          type: "answer",
          from: myId,
          to: remoteId,
          sdp: conn.localDescription.toJSON()
        });
        log(`Sent answer to "${remoteId}".`);
      } else if (payload.type === "answer") {
        if (!pc) return;
        log(`Received answer from "${remoteId}".`);
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        await flushPendingCandidates();
      } else if (payload.type === "ice" && payload.candidate) {
        if (pc && pc.remoteDescription) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
          } catch (err) {
            log(`ICE error: ${err.message}`);
          }
        } else {
          pendingCandidates.push(payload.candidate);
        }
      }
    }

    async function startVideoChat() {
      const targetPeer = sanitizeId(peerIdInput.value);
      if (!targetPeer) {
        log("Please enter a valid Peer ID first.");
        return;
      }
      peerIdInput.value = targetPeer;

      try {
        await ensureLocalMedia();
        const conn = createPeerConnection(targetPeer);
        const dc = conn.createDataChannel("chat");
        bindDataChannel(dc);

        const offer = await conn.createOffer();
        await conn.setLocalDescription(offer);

        signalChannel.postMessage({
          type: "offer",
          from: myId,
          to: targetPeer,
          sdp: conn.localDescription.toJSON()
        });
        signalBox.value = JSON.stringify({
          type: "offer",
          from: myId,
          to: targetPeer,
          sdp: conn.localDescription.toJSON()
        }, null, 2);

        log(`Started video chat offer from "${myId}" to "${targetPeer}".`);
        setStatus(`Calling "${targetPeer}"...`);
      } catch (err) {
        log(`Start video chat failed: ${err.message}`);
        setStatus(`Error: ${err.message}`);
      }
    }

    function hangUp() {
      if (dataChannel) {
        try { dataChannel.close(); } catch (_) {}
        dataChannel = null;
      }
      if (pc) {
        try { pc.close(); } catch (_) {}
        pc = null;
      }
      if (localStream) {
        for (const track of localStream.getTracks()) {
          track.stop();
        }
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      pendingCandidates = [];
      log("Call ended and local media stopped.");
      setStatus(`Ready as "${myId}"`);
    }

    setIdBtn.addEventListener("click", () => applyMyId(myIdInput.value, "button"));
    myIdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        applyMyId(myIdInput.value, "enter");
      }
    });
    randomIdBtn.addEventListener("click", () => applyMyId(generateRandomId(), "random"));

    startCallBtn.addEventListener("click", startVideoChat);
    hangupBtn.addEventListener("click", hangUp);

    createOfferBtn.addEventListener("click", async () => {
      const targetPeer = sanitizeId(peerIdInput.value) || "PEER";
      await ensureLocalMedia();
      const conn = createPeerConnection(targetPeer);
      bindDataChannel(conn.createDataChannel("chat"));
      const offer = await conn.createOffer();
      await conn.setLocalDescription(offer);
      signalBox.value = JSON.stringify({
        type: "offer",
        from: myId,
        to: targetPeer,
        sdp: conn.localDescription.toJSON()
      }, null, 2);
      log("Generated manual Offer JSON in signaling box.");
    });

    applySignalBtn.addEventListener("click", async () => {
      try {
        const parsed = JSON.parse(signalBox.value);
        await handleIncomingSignal(parsed);
        log("Applied manual Signal JSON.");
      } catch (err) {
        log(`Invalid Signal JSON: ${err.message}`);
      }
    });

    sendChatBtn.addEventListener("click", () => {
      const text = chatInput.value.trim();
      if (!text) return;
      if (!dataChannel || dataChannel.readyState !== "open") {
        log("Cannot send chat: DataChannel is not open yet.");
        return;
      }
      dataChannel.send(text);
      appendChat(`Me (${myId})`, text);
      chatInput.value = "";
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendChatBtn.click();
      }
    });

    clearLogBtn.addEventListener("click", () => {
      logBox.textContent = "";
    });

    let savedId = "";
    try {
      savedId = localStorage.getItem(STORAGE_KEY) || "";
    } catch (_) {}
    applyMyId(savedId || generateRandomId(), "init");
  </script>
</body>
</html>
