<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC STUN Video Chat (Invite Link)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    input, textarea, button {
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      padding: 9px 12px;
    }
    input, textarea {
      background: var(--panel-2);
      color: var(--text);
    }
    input[type="text"] { min-width: 170px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: #334155; }
    button.success { background: #16a34a; }
    button.danger { background: #dc2626; }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
      border-radius: 8px;
      object-fit: cover;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .chat-messages, .log-box {
      height: 200px;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .log-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }
    .msg { margin-bottom: 8px; }
    .msg .meta { color: var(--muted); font-size: 0.76rem; }
    .status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 10px;
    }
    textarea.link-box {
      width: 100%;
      min-height: 72px;
      font-family: monospace;
      font-size: 0.78rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="margin: 0 0 12px;">WebRTC STUN Video Chat (Shareable Link)</h2>
      <div class="row">
        <div>
          <label for="my-id-input">1. My ID</label>
          <input id="my-id-input" type="text" placeholder="e.g. ALI" maxlength="32" />
        </div>
        <div>
          <label for="peer-id-input">2. Peer ID (optional)</label>
          <input id="peer-id-input" type="text" placeholder="e.g. MOHSEN" maxlength="32" />
        </div>
        <div class="row">
          <button id="start-call-btn" class="success" type="button">Start &amp; Create Link</button>
          <button id="hangup-btn" class="danger" type="button">Hang Up</button>
        </div>
      </div>

      <div class="status" id="status-line">Status: Enter My ID and click "Start &amp; Create Link" (STUN-only, no TURN)</div>

      <div style="margin-top: 12px;">
        <label for="share-link-box">Shareable Link (Offer Link for Peer, or Return Answer Link back to Caller)</label>
        <div class="row">
          <button id="copy-link-btn" class="secondary" type="button">Copy Link</button>
          <button id="apply-link-btn" class="secondary" type="button">Apply Pasted Link / Code</button>
        </div>
        <textarea id="share-link-box" class="link-box" placeholder="Generated link appears here—or paste a link/code from your peer and click 'Apply Pasted Link / Code'..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="videos">
        <div>
          <label>Local Video (Me)</label>
          <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div>
          <label>Remote Video (Peer)</label>
          <video id="remote-video" autoplay playsinline></video>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3 style="margin: 0 0 8px;">Text Chat</h3>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="row" style="margin-top: 8px;">
          <input id="chat-input" type="text" placeholder="Type a message..." style="flex: 1;" />
          <button id="send-chat-btn" type="button">Send</button>
        </div>
      </div>

      <div class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
          <h3 style="margin: 0;">Event Log</h3>
          <button id="clear-log-btn" class="secondary" type="button" style="padding: 5px 10px; font-size: 0.8rem;">Clear</button>
        </div>
        <div id="log-box" class="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    };

    const myIdInput = document.getElementById("my-id-input");
    const peerIdInput = document.getElementById("peer-id-input");
    const startCallBtn = document.getElementById("start-call-btn");
    const hangupBtn = document.getElementById("hangup-btn");
    const copyLinkBtn = document.getElementById("copy-link-btn");
    const applyLinkBtn = document.getElementById("apply-link-btn");
    const shareLinkBox = document.getElementById("share-link-box");
    const localVideo = document.getElementById("local-video");
    const remoteVideo = document.getElementById("remote-video");
    const chatMessages = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendChatBtn = document.getElementById("send-chat-btn");
    const logBox = document.getElementById("log-box");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const statusLine = document.getElementById("status-line");

    let localStream = null;
    let pc = null;
    let dataChannel = null;
    let gatheredCandidates = [];
    let pendingRemoteCandidates = [];

    function log(msg) {
      const now = new Date();
      const ts = now.toTimeString().split(" ")[0] + "." + String(now.getMilliseconds()).padStart(3, "0");
      logBox.textContent += `[${ts}] ${msg}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text) {
      statusLine.textContent = `Status: ${text}`;
    }

    function appendChat(sender, text) {
      const div = document.createElement("div");
      div.className = "msg";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${sender} · ${new Date().toLocaleTimeString()}`;
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(meta);
      div.appendChild(body);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function bytesToBase64Url(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function base64UrlToBytes(b64url) {
      const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((b64url.length + 3) % 4);
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function encodePayload(obj) {
      const jsonStr = JSON.stringify(obj);
      const rawBytes = new TextEncoder().encode(jsonStr);
      if (typeof CompressionStream !== "undefined") {
        const cs = new CompressionStream("deflate-raw");
        const writer = cs.writable.getWriter();
        writer.write(rawBytes);
        writer.close();
        const compBuf = await new Response(cs.readable).arrayBuffer();
        return "z." + bytesToBase64Url(new Uint8Array(compBuf));
      }
      return "p." + bytesToBase64Url(rawBytes);
    }

    async function decodePayload(token) {
      if (token.startsWith("z.") && typeof DecompressionStream !== "undefined") {
        const compBytes = base64UrlToBytes(token.slice(2));
        const ds = new DecompressionStream("deflate-raw");
        const writer = ds.writable.getWriter();
        writer.write(compBytes);
        writer.close();
        const rawBuf = await new Response(ds.readable).arrayBuffer();
        return JSON.parse(new TextDecoder().decode(rawBuf));
      }
      const encoded = token.startsWith("p.") ? token.slice(2) : token;
      return JSON.parse(new TextDecoder().decode(base64UrlToBytes(encoded)));
    }

    function buildShareUrl(kind, token) {
      const base = `${location.origin}${location.pathname}`;
      return `${base}#${kind}=${encodeURIComponent(token)}`;
    }

    function extractTokenFromInput(raw) {
      const trimmed = raw.trim();
      const hashIdx = trimmed.indexOf("#");
      const hashPart = hashIdx >= 0 ? trimmed.slice(hashIdx + 1) : trimmed;
      const params = new URLSearchParams(hashPart);
      if (params.has("offer")) return { kind: "offer", token: params.get("offer") };
      if (params.has("answer")) return { kind: "answer", token: params.get("answer") };
      return null;
    }

    async function ensureLocalMedia() {
      if (localStream) return localStream;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Camera/mic requires HTTPS or localhost.");
      }
      log("Requesting camera and microphone...");
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      log(`Local media ready (video=${localStream.getVideoTracks().length}, audio=${localStream.getAudioTracks().length}).`);
      return localStream;
    }

    function bindDataChannel(dc) {
      dataChannel = dc;
      dc.onopen = () => {
        log("DataChannel opened — text chat ready.");
        setStatus("Connected (STUN direct P2P)");
      };
      dc.onclose = () => log("DataChannel closed.");
      dc.onerror = (e) => log(`DataChannel error: ${e.message || "unknown"}`);
      dc.onmessage = (event) => appendChat("Peer", String(event.data));
    }

    function waitForIceGatheringComplete(peerConn, timeoutMs = 4000) {
      if (peerConn.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const timer = setTimeout(() => {
          peerConn.removeEventListener("icegatheringstatechange", onChange);
          resolve();
        }, timeoutMs);
        function onChange() {
          if (peerConn.iceGatheringState === "complete") {
            clearTimeout(timer);
            peerConn.removeEventListener("icegatheringstatechange", onChange);
            resolve();
          }
        }
        peerConn.addEventListener("icegatheringstatechange", onChange);
      });
    }

    function createPeerConnection() {
      if (pc) pc.close();
      gatheredCandidates = [];
      pendingRemoteCandidates = [];
      pc = new RTCPeerConnection(RTC_CONFIG);

      if (localStream) {
        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }
      }

      pc.ontrack = (event) => {
        log(`Remote ${event.track.kind} track received.`);
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        } else {
          if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
          remoteVideo.srcObject.addTrack(event.track);
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) gatheredCandidates.push(event.candidate.toJSON());
      };

      pc.onicegatheringstatechange = () => log(`ICE gathering state: ${pc.iceGatheringState}`);
      pc.oniceconnectionstatechange = () => log(`ICE connection state: ${pc.iceConnectionState}`);
      pc.onconnectionstatechange = () => {
        log(`Peer connection state: ${pc.connectionState}`);
        setStatus(`Connection: ${pc.connectionState}`);
      };

      return pc;
    }

    async function flushPendingCandidates() {
      if (!pc || !pc.remoteDescription) return;
      while (pendingRemoteCandidates.length > 0) {
        const c = pendingRemoteCandidates.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        } catch (err) {
          log(`Candidate error: ${err.message}`);
        }
      }
    }

    async function startAndCreateLink() {
      try {
        const myId = myIdInput.value.trim() || "CALLER";
        const peerId = peerIdInput.value.trim() || "";
        await ensureLocalMedia();

        const conn = createPeerConnection();
        bindDataChannel(conn.createDataChannel("chat"));

        const offer = await conn.createOffer();
        await conn.setLocalDescription(offer);
        await waitForIceGatheringComplete(conn);

        const token = await encodePayload({
          type: "offer",
          from: myId,
          to: peerId,
          sdp: conn.localDescription.toJSON(),
          candidates: gatheredCandidates
        });
        const link = buildShareUrl("offer", token);
        shareLinkBox.value = link;
        log(`Created offer link (${link.length} chars) with ${gatheredCandidates.length} candidates. Share link with peer.`);
        setStatus("Offer link ready — share with peer");
      } catch (err) {
        log(`Error: ${err.message}`);
        setStatus(`Error: ${err.message}`);
      }
    }

    async function processLinkString(rawInput) {
      const parsedLink = extractTokenFromInput(rawInput);
      if (!parsedLink) throw new Error("No #offer= or #answer= found in link/input.");
      const payload = await decodePayload(parsedLink.token);
      const myId = myIdInput.value.trim() || (parsedLink.kind === "offer" ? "PEER" : "CALLER");

      if (payload.from && !peerIdInput.value.trim()) {
        peerIdInput.value = payload.from;
      }

      if (payload.type === "offer") {
        log(`Opened offer link from "${payload.from || "peer"}"...`);
        await ensureLocalMedia();
        const conn = createPeerConnection();
        conn.ondatachannel = (event) => bindDataChannel(event.channel);

        await conn.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        for (const c of (payload.candidates || [])) {
          await conn.addIceCandidate(new RTCIceCandidate(c));
        }

        const answer = await conn.createAnswer();
        await conn.setLocalDescription(answer);
        await waitForIceGatheringComplete(conn);

        const ansToken = await encodePayload({
          type: "answer",
          from: myId,
          to: payload.from || "",
          sdp: conn.localDescription.toJSON(),
          candidates: gatheredCandidates
        });
        const returnLink = buildShareUrl("answer", ansToken);
        shareLinkBox.value = returnLink;
        log(`Created return answer link (${returnLink.length} chars). Send it back to caller.`);
        setStatus("Answer link ready — send back to caller");
      } else if (payload.type === "answer") {
        if (!pc) throw new Error("No active offer session found to apply this answer.");
        log(`Applying answer from "${payload.from || "peer"}"...`);
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        for (const c of (payload.candidates || [])) {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        }
        await flushPendingCandidates();
        log("Answer applied; establishing STUN P2P connection...");
        setStatus("Answer applied — connecting...");
      }
    }

    function hangUp() {
      if (dataChannel) { try { dataChannel.close(); } catch (_) {} dataChannel = null; }
      if (pc) { try { pc.close(); } catch (_) {} pc = null; }
      if (localStream) {
        for (const t of localStream.getTracks()) t.stop();
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      gatheredCandidates = [];
      pendingRemoteCandidates = [];
      log("Call ended and local media stopped.");
      setStatus("Call ended");
    }

    startCallBtn.addEventListener("click", startAndCreateLink);
    hangupBtn.addEventListener("click", hangUp);

    applyLinkBtn.addEventListener("click", async () => {
      try {
        await processLinkString(shareLinkBox.value);
      } catch (err) {
        log(`Link error: ${err.message}`);
        setStatus(`Error: ${err.message}`);
      }
    });

    copyLinkBtn.addEventListener("click", async () => {
      if (!shareLinkBox.value.trim()) return;
      try {
        await navigator.clipboard.writeText(shareLinkBox.value);
        log("Copied link to clipboard.");
      } catch (_) {
        shareLinkBox.select();
        document.execCommand("copy");
        log("Selected/copied link.");
      }
    });

    sendChatBtn.addEventListener("click", () => {
      const text = chatInput.value.trim();
      if (!text) return;
      if (!dataChannel || dataChannel.readyState !== "open") {
        log("DataChannel is not open yet.");
        return;
      }
      dataChannel.send(text);
      appendChat(`Me (${myIdInput.value.trim() || "Me"})`, text);
      chatInput.value = "";
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendChatBtn.click();
      }
    });

    clearLogBtn.addEventListener("click", () => { logBox.textContent = ""; });

    if (location.hash && (location.hash.includes("offer=") || location.hash.includes("answer="))) {
      shareLinkBox.value = location.href;
      log("Detected signaling link in URL hash. Click 'Apply Pasted Link / Code' (or enter My ID first) to proceed.");
      setStatus("Link detected in URL — ready to apply");
    }
  </script>
</body>
</html>
