<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC STUN Video Chat (Specify ID First)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    input, textarea, button {
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      padding: 9px 12px;
    }
    input, textarea {
      background: var(--panel-2);
      color: var(--text);
    }
    input[type="text"] { min-width: 180px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: #334155; }
    button.success { background: #16a34a; }
    button.danger { background: #dc2626; }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
      border-radius: 8px;
      object-fit: cover;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .chat-messages, .log-box {
      height: 210px;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .log-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }
    .msg { margin-bottom: 8px; }
    .msg .meta { color: var(--muted); font-size: 0.76rem; }
    .status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 10px;
    }
    textarea {
      width: 100%;
      min-height: 92px;
      font-family: monospace;
      font-size: 0.78rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="margin: 0 0 12px;">WebRTC STUN Video Chat</h2>
      <div class="row">
        <div>
          <label for="my-id-input">1. My ID (specify first)</label>
          <input id="my-id-input" type="text" placeholder="Type your ID (e.g. ALI)" maxlength="32" autofocus />
        </div>

        <div>
          <label for="peer-id-input">2. Peer ID</label>
          <input id="peer-id-input" type="text" placeholder="Enter remote ID (e.g. MOHSEN)" maxlength="32" />
        </div>

        <div class="row">
          <button id="start-call-btn" class="success" type="button">Start Video Chat</button>
          <button id="hangup-btn" class="danger" type="button">Hang Up</button>
        </div>
      </div>

      <div class="status" id="status-line">Status: Enter My ID first, then Peer ID and Start Video Chat</div>

      <div style="margin-top: 12px;">
        <label for="signal-box">Signaling Offer / Answer JSON (copy between Mobile &amp; Laptop)</label>
        <div class="row" style="margin-bottom: 6px;">
          <button id="copy-signal-btn" class="secondary" type="button">Copy JSON</button>
          <button id="apply-signal-btn" class="secondary" type="button">Apply Pasted JSON</button>
        </div>
        <textarea id="signal-box" placeholder="Offer or Answer JSON is generated here when starting/answering—paste remote JSON here and click 'Apply Pasted JSON'..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="videos">
        <div>
          <label>Local Video (Me)</label>
          <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div>
          <label>Remote Video (Peer)</label>
          <video id="remote-video" autoplay playsinline></video>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3 style="margin: 0 0 8px;">Text Chat</h3>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="row" style="margin-top: 8px;">
          <input id="chat-input" type="text" placeholder="Type a message..." style="flex: 1;" />
          <button id="send-chat-btn" type="button">Send</button>
        </div>
      </div>

      <div class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
          <h3 style="margin: 0;">Event Log</h3>
          <button id="clear-log-btn" class="secondary" type="button" style="padding: 5px 10px; font-size: 0.8rem;">Clear</button>
        </div>
        <div id="log-box" class="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    };

    const myIdInput = document.getElementById("my-id-input");
    const peerIdInput = document.getElementById("peer-id-input");
    const startCallBtn = document.getElementById("start-call-btn");
    const hangupBtn = document.getElementById("hangup-btn");
    const copySignalBtn = document.getElementById("copy-signal-btn");
    const applySignalBtn = document.getElementById("apply-signal-btn");
    const signalBox = document.getElementById("signal-box");
    const localVideo = document.getElementById("local-video");
    const remoteVideo = document.getElementById("remote-video");
    const chatMessages = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendChatBtn = document.getElementById("send-chat-btn");
    const logBox = document.getElementById("log-box");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const statusLine = document.getElementById("status-line");

    let localStream = null;
    let pc = null;
    let dataChannel = null;
    let gatheredCandidates = [];
    let pendingRemoteCandidates = [];

    function log(msg) {
      const now = new Date();
      const ts = now.toTimeString().split(" ")[0] + "." + String(now.getMilliseconds()).padStart(3, "0");
      logBox.textContent += `[${ts}] ${msg}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text) {
      statusLine.textContent = `Status: ${text}`;
    }

    function appendChat(sender, text) {
      const div = document.createElement("div");
      div.className = "msg";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${sender} · ${new Date().toLocaleTimeString()}`;
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(meta);
      div.appendChild(body);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getMyId() {
      const val = myIdInput.value.trim();
      if (!val) {
        throw new Error("Please specify your 'My ID' first.");
      }
      return val;
    }

    function getPeerId(fallback = "") {
      const val = peerIdInput.value.trim() || fallback.trim();
      if (!val) {
        throw new Error("Please enter the 'Peer ID'.");
      }
      return val;
    }

    async function ensureLocalMedia() {
      if (localStream) return localStream;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Camera/mic requires HTTPS or localhost.");
      }
      log("Requesting camera and microphone...");
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      log(`Local media ready (video=${localStream.getVideoTracks().length}, audio=${localStream.getAudioTracks().length}).`);
      return localStream;
    }

    function bindDataChannel(dc) {
      dataChannel = dc;
      dc.onopen = () => {
        log("DataChannel opened — text chat active.");
        setStatus("Connected (Video + Text Chat ready)");
      };
      dc.onclose = () => log("DataChannel closed.");
      dc.onerror = (e) => log(`DataChannel error: ${e.message || "unknown"}`);
      dc.onmessage = (event) => appendChat("Peer", String(event.data));
    }

    function waitForIceGatheringComplete(peerConn, timeoutMs = 4000) {
      if (peerConn.iceGatheringState === "complete") {
        return Promise.resolve();
      }
      return new Promise((resolve) => {
        const timer = setTimeout(() => {
          peerConn.removeEventListener("icegatheringstatechange", onChange);
          resolve();
        }, timeoutMs);

        function onChange() {
          if (peerConn.iceGatheringState === "complete") {
            clearTimeout(timer);
            peerConn.removeEventListener("icegatheringstatechange", onChange);
            resolve();
          }
        }
        peerConn.addEventListener("icegatheringstatechange", onChange);
      });
    }

    function createPeerConnection() {
      if (pc) pc.close();
      gatheredCandidates = [];
      pendingRemoteCandidates = [];
      pc = new RTCPeerConnection(RTC_CONFIG);

      if (localStream) {
        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }
      }

      pc.ontrack = (event) => {
        log(`Remote ${event.track.kind} track received.`);
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        } else {
          if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
          remoteVideo.srcObject.addTrack(event.track);
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          gatheredCandidates.push(event.candidate.toJSON());
        }
      };

      pc.onicegatheringstatechange = () => log(`ICE gathering state: ${pc.iceGatheringState}`);
      pc.oniceconnectionstatechange = () => log(`ICE connection state: ${pc.iceConnectionState}`);
      pc.onconnectionstatechange = () => {
        log(`Peer connection state: ${pc.connectionState}`);
        setStatus(`Connection: ${pc.connectionState}`);
      };

      return pc;
    }

    async function flushPendingCandidates() {
      if (!pc || !pc.remoteDescription) return;
      while (pendingRemoteCandidates.length > 0) {
        const cand = pendingRemoteCandidates.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (err) {
          log(`Failed adding remote candidate: ${err.message}`);
        }
      }
    }

    async function startVideoChat() {
      try {
        const myId = getMyId();
        const peerId = getPeerId();

        await ensureLocalMedia();
        const conn = createPeerConnection();
        bindDataChannel(conn.createDataChannel("chat"));

        const offer = await conn.createOffer();
        await conn.setLocalDescription(offer);
        await waitForIceGatheringComplete(conn);

        const bundle = {
          type: "offer",
          from: myId,
          to: peerId,
          sdp: conn.localDescription.toJSON(),
          candidates: gatheredCandidates
        };
        signalBox.value = JSON.stringify(bundle, null, 2);
        log(`Offer created as "${myId}" for "${peerId}" with ${gatheredCandidates.length} ICE candidates. Copy JSON to peer.`);
        setStatus(`Offer ready for "${peerId}" — copy JSON to peer`);
      } catch (err) {
        log(`Error: ${err.message}`);
        setStatus(`Error: ${err.message}`);
      }
    }

    async function applySignalJson() {
      try {
        const myId = getMyId();
        const raw = signalBox.value.trim();
        if (!raw) throw new Error("Paste an Offer or Answer JSON first.");
        const msg = JSON.parse(raw);

        if (msg.from && !peerIdInput.value.trim()) {
          peerIdInput.value = msg.from;
        }

        if (msg.type === "offer") {
          log(`Applying offer from "${msg.from || "peer"}" as "${myId}"...`);
          await ensureLocalMedia();
          const conn = createPeerConnection();
          conn.ondatachannel = (event) => bindDataChannel(event.channel);

          await conn.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          for (const c of (msg.candidates || [])) {
            await conn.addIceCandidate(new RTCIceCandidate(c));
          }

          const answer = await conn.createAnswer();
          await conn.setLocalDescription(answer);
          await waitForIceGatheringComplete(conn);

          const reply = {
            type: "answer",
            from: myId,
            to: msg.from || getPeerId(),
            sdp: conn.localDescription.toJSON(),
            candidates: gatheredCandidates
          };
          signalBox.value = JSON.stringify(reply, null, 2);
          log(`Answer created as "${myId}" with ${gatheredCandidates.length} ICE candidates. Copy JSON back to caller.`);
          setStatus(`Answer ready — copy JSON back to "${msg.from || "caller"}"`);
        } else if (msg.type === "answer") {
          if (!pc) throw new Error("No active offer connection on this side.");
          log(`Applying answer from "${msg.from || "peer"}"...`);
          await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          for (const c of (msg.candidates || [])) {
            await pc.addIceCandidate(new RTCIceCandidate(c));
          }
          await flushPendingCandidates();
          log("Answer applied; waiting for ICE / peer connection.");
          setStatus("Answer applied — connecting...");
        } else {
          throw new Error(`Unsupported signal type: ${msg.type}`);
        }
      } catch (err) {
        log(`Signal error: ${err.message}`);
        setStatus(`Error: ${err.message}`);
      }
    }

    function hangUp() {
      if (dataChannel) {
        try { dataChannel.close(); } catch (_) {}
        dataChannel = null;
      }
      if (pc) {
        try { pc.close(); } catch (_) {}
        pc = null;
      }
      if (localStream) {
        for (const track of localStream.getTracks()) track.stop();
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      gatheredCandidates = [];
      pendingRemoteCandidates = [];
      log("Call ended and media stopped.");
      setStatus("Call ended");
    }

    startCallBtn.addEventListener("click", startVideoChat);
    hangupBtn.addEventListener("click", hangUp);
    applySignalBtn.addEventListener("click", applySignalJson);

    copySignalBtn.addEventListener("click", async () => {
      if (!signalBox.value.trim()) return;
      try {
        await navigator.clipboard.writeText(signalBox.value);
        log("Copied signaling JSON to clipboard.");
      } catch (_) {
        signalBox.select();
        document.execCommand("copy");
        log("Selected/copied signaling JSON.");
      }
    });

    sendChatBtn.addEventListener("click", () => {
      const text = chatInput.value.trim();
      if (!text) return;
      if (!dataChannel || dataChannel.readyState !== "open") {
        log("DataChannel is not open yet.");
        return;
      }
      dataChannel.send(text);
      appendChat(`Me (${myIdInput.value.trim() || "Me"})`, text);
      chatInput.value = "";
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendChatBtn.click();
      }
    });

    clearLogBtn.addEventListener("click", () => {
      logBox.textContent = "";
    });
  </script>
</body>
</html>
