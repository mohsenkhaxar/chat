<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC STUN Video Chat (ID Signaling via MQTT)</title>
  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    input, button {
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      padding: 9px 12px;
    }
    input {
      background: var(--panel-2);
      color: var(--text);
    }
    input[type="text"] { min-width: 170px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: #334155; }
    button.success { background: #16a34a; }
    button.danger { background: #dc2626; }
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
      border-radius: 8px;
      object-fit: cover;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .chat-messages, .log-box {
      height: 210px;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    .log-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }
    .msg { margin-bottom: 8px; }
    .msg .meta { color: var(--muted); font-size: 0.76rem; }
    .status {
      font-size: 0.85rem;
      color: var(--accent);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="margin: 0 0 12px;">WebRTC STUN Video Chat (ID Signaling)</h2>
      <div class="row">
        <div>
          <label for="my-id-input">1. My ID (specify first)</label>
          <input id="my-id-input" type="text" placeholder="e.g. ALI" maxlength="32" autofocus />
        </div>

        <div>
          <label for="peer-id-input">2. Peer ID</label>
          <input id="peer-id-input" type="text" placeholder="e.g. MOHSEN" maxlength="32" />
        </div>

        <div>
          <label for="broker-input">Signaling Broker (WSS)</label>
          <input id="broker-input" type="text" value="wss://broker.emqx.io:8084/mqtt" style="min-width: 240px;" />
        </div>

        <div class="row">
          <button id="connect-btn" class="secondary" type="button">Listen on My ID</button>
          <button id="start-call-btn" class="success" type="button">Start Video Chat</button>
          <button id="hangup-btn" class="danger" type="button">Hang Up</button>
        </div>
      </div>

      <div class="status" id="status-line">Status: Type My ID first, then Peer ID and Start Video Chat (STUN-only, no TURN)</div>
    </div>

    <div class="card">
      <div class="videos">
        <div>
          <label>Local Video (Me)</label>
          <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div>
          <label>Remote Video (Peer)</label>
          <video id="remote-video" autoplay playsinline></video>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3 style="margin: 0 0 8px;">Text Chat</h3>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="row" style="margin-top: 8px;">
          <input id="chat-input" type="text" placeholder="Type a message..." style="flex: 1;" />
          <button id="send-chat-btn" type="button">Send</button>
        </div>
      </div>

      <div class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
          <h3 style="margin: 0;">Event Log</h3>
          <button id="clear-log-btn" class="secondary" type="button" style="padding: 5px 10px; font-size: 0.8rem;">Clear</button>
        </div>
        <div id="log-box" class="log-box"></div>
      </div>
    </div>
  </div>

  <script>
    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    };

    const TOPIC_PREFIX = "webrtc-stun-id-v1";

    const myIdInput = document.getElementById("my-id-input");
    const peerIdInput = document.getElementById("peer-id-input");
    const brokerInput = document.getElementById("broker-input");
    const connectBtn = document.getElementById("connect-btn");
    const startCallBtn = document.getElementById("start-call-btn");
    const hangupBtn = document.getElementById("hangup-btn");
    const localVideo = document.getElementById("local-video");
    const remoteVideo = document.getElementById("remote-video");
    const chatMessages = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendChatBtn = document.getElementById("send-chat-btn");
    const logBox = document.getElementById("log-box");
    const clearLogBtn = document.getElementById("clear-log-btn");
    const statusLine = document.getElementById("status-line");

    let mqttClient = null;
    let boundId = "";
    let localStream = null;
    let pc = null;
    let dataChannel = null;
    let pendingRemoteCandidates = [];

    function log(msg) {
      const now = new Date();
      const ts = now.toTimeString().split(" ")[0] + "." + String(now.getMilliseconds()).padStart(3, "0");
      logBox.textContent += `[${ts}] ${msg}\n`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text) {
      statusLine.textContent = `Status: ${text}`;
    }

    function appendChat(sender, text) {
      const div = document.createElement("div");
      div.className = "msg";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${sender} · ${new Date().toLocaleTimeString()}`;
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(meta);
      div.appendChild(body);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function requireMyId() {
      const id = myIdInput.value.trim();
      if (!id) throw new Error("Please type 'My ID' first.");
      return id;
    }

    function requirePeerId(fallback = "") {
      const id = peerIdInput.value.trim() || fallback.trim();
      if (!id) throw new Error("Please enter 'Peer ID'.");
      return id;
    }

    function topicFor(id) {
      return `${TOPIC_PREFIX}/${encodeURIComponent(id)}`;
    }

    async function ensureMqttRegistered() {
      const myId = requireMyId();
      const brokerUrl = brokerInput.value.trim();
      if (!brokerUrl) throw new Error("Signaling broker URL is required.");

      if (mqttClient && mqttClient.connected && boundId === myId) {
        return mqttClient;
      }

      if (mqttClient) {
        try { mqttClient.end(true); } catch (_) {}
        mqttClient = null;
      }

      boundId = myId;
      const clientId = `web-${myId}-${Math.random().toString(36).slice(2, 8)}`;
      log(`Connecting to signaling broker as "${myId}"...`);
      setStatus(`Registering ID "${myId}"...`);

      return new Promise((resolve, reject) => {
        const client = mqtt.connect(brokerUrl, {
          clientId,
          clean: true,
          reconnectPeriod: 3000,
          connectTimeout: 8000
        });

        const onConnect = () => {
          cleanupListeners();
          mqttClient = client;
          const myTopic = topicFor(myId);
          client.subscribe(myTopic, { qos: 0 }, (err) => {
            if (err) {
              log(`Subscribe error on "${myTopic}": ${err.message}`);
            } else {
              log(`Listening for calls on ID "${myId}" (${myTopic}).`);
              setStatus(`Ready as "${myId}"`);
            }
          });
          resolve(client);
        };

        const onError = (err) => {
          cleanupListeners();
          log(`Signaling broker error: ${err.message || err}`);
          reject(new Error(`Signaling broker failed: ${err.message || "connection error"}`));
        };

        function cleanupListeners() {
          client.off("connect", onConnect);
          client.off("error", onError);
        }

        client.on("connect", onConnect);
        client.on("error", onError);
        client.on("offline", () => log("Signaling broker offline; will retry."));
        client.on("reconnect", () => log("Reconnecting to signaling broker..."));

        client.on("message", async (_topic, payload) => {
          try {
            const msg = JSON.parse(payload.toString());
            if (!msg || !msg.from || msg.from === boundId) return;
            await handleSignalMessage(msg);
          } catch (err) {
            log(`Invalid signaling payload: ${err.message}`);
          }
        });
      });
    }

    function sendSignal(targetId, data) {
      if (!mqttClient || !mqttClient.connected) {
        throw new Error("Signaling channel not connected.");
      }
      const targetTopic = topicFor(targetId);
      mqttClient.publish(targetTopic, JSON.stringify({
        ...data,
        from: boundId,
        to: targetId
      }));
    }

    async function ensureLocalMedia() {
      if (localStream) return localStream;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Camera/mic requires HTTPS or localhost.");
      }
      log("Requesting camera and microphone...");
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      log(`Local media ready (video=${localStream.getVideoTracks().length}, audio=${localStream.getAudioTracks().length}).`);
      return localStream;
    }

    function bindDataChannel(dc) {
      dataChannel = dc;
      dc.onopen = () => {
        log("DataChannel opened — text chat ready.");
        setStatus(`Connected to "${peerIdInput.value.trim() || "peer"}" (STUN direct P2P)`);
      };
      dc.onclose = () => log("DataChannel closed.");
      dc.onerror = (e) => log(`DataChannel error: ${e.message || "unknown"}`);
      dc.onmessage = (event) => appendChat("Peer", String(event.data));
    }

    function createPeerConnection(remotePeerId) {
      if (pc) pc.close();
      pendingRemoteCandidates = [];
      pc = new RTCPeerConnection(RTC_CONFIG);

      if (localStream) {
        for (const track of localStream.getTracks()) {
          pc.addTrack(track, localStream);
        }
      }

      pc.ontrack = (event) => {
        log(`Remote ${event.track.kind} track received.`);
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        } else {
          if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
          remoteVideo.srcObject.addTrack(event.track);
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && remotePeerId) {
          sendSignal(remotePeerId, {
            type: "candidate",
            candidate: event.candidate.toJSON()
          });
        }
      };

      pc.onicegatheringstatechange = () => log(`ICE gathering state: ${pc.iceGatheringState}`);
      pc.oniceconnectionstatechange = () => log(`ICE connection state: ${pc.iceConnectionState}`);
      pc.onconnectionstatechange = () => {
        log(`Peer connection state: ${pc.connectionState}`);
        setStatus(`Connection: ${pc.connectionState}`);
      };

      return pc;
    }

    async function flushPendingCandidates() {
      if (!pc || !pc.remoteDescription) return;
      while (pendingRemoteCandidates.length > 0) {
        const cand = pendingRemoteCandidates.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (err) {
          log(`Failed adding candidate: ${err.message}`);
        }
      }
    }

    async function handleSignalMessage(msg) {
      if (!peerIdInput.value.trim() && msg.from) {
        peerIdInput.value = msg.from;
      }

      if (msg.type === "offer") {
        log(`Incoming call offer from "${msg.from}".`);
        setStatus(`Incoming call from "${msg.from}"...`);
        await ensureLocalMedia();
        const conn = createPeerConnection(msg.from);
        conn.ondatachannel = (event) => bindDataChannel(event.channel);

        await conn.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        await flushPendingCandidates();

        const answer = await conn.createAnswer();
        await conn.setLocalDescription(answer);
        sendSignal(msg.from, {
          type: "answer",
          sdp: conn.localDescription.toJSON()
        });
        log(`Sent answer to "${msg.from}" via ID signaling.`);
      } else if (msg.type === "answer") {
        if (!pc) return;
        log(`Received answer from "${msg.from}".`);
        await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        await flushPendingCandidates();
      } else if (msg.type === "candidate" && msg.candidate) {
        if (pc && pc.remoteDescription) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch (err) {
            log(`Candidate error: ${err.message}`);
          }
        } else {
          pendingRemoteCandidates.push(msg.candidate);
        }
      } else if (msg.type === "hangup") {
        log(`Peer "${msg.from}" hung up.`);
        hangUp(false);
      }
    }

    async function startVideoChat() {
      try {
        await ensureMqttRegistered();
        const peerId = requirePeerId();
        await ensureLocalMedia();

        const conn = createPeerConnection(peerId);
        bindDataChannel(conn.createDataChannel("chat"));

        const offer = await conn.createOffer();
        await conn.setLocalDescription(offer);

        sendSignal(peerId, {
          type: "offer",
          sdp: conn.localDescription.toJSON()
        });
        log(`Calling "${peerId}" as "${boundId}" (STUN candidate discovery in progress)...`);
        setStatus(`Calling "${peerId}"...`);
      } catch (err) {
        log(`Error: ${err.message}`);
        setStatus(`Error: ${err.message}`);
      }
    }

    function hangUp(notifyPeer = true) {
      if (notifyPeer && peerIdInput.value.trim() && mqttClient && mqttClient.connected) {
        try {
          sendSignal(peerIdInput.value.trim(), { type: "hangup" });
        } catch (_) {}
      }
      if (dataChannel) {
        try { dataChannel.close(); } catch (_) {}
        dataChannel = null;
      }
      if (pc) {
        try { pc.close(); } catch (_) {}
        pc = null;
      }
      if (localStream) {
        for (const track of localStream.getTracks()) track.stop();
        localStream = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      pendingRemoteCandidates = [];
      log("Call ended and local media stopped.");
      setStatus(boundId ? `Ready as "${boundId}"` : "Idle");
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await ensureMqttRegistered();
      } catch (err) {
        log(`Error: ${err.message}`);
        setStatus(`Error: ${err.message}`);
      }
    });

    startCallBtn.addEventListener("click", startVideoChat);
    hangupBtn.addEventListener("click", () => hangUp(true));

    sendChatBtn.addEventListener("click", () => {
      const text = chatInput.value.trim();
      if (!text) return;
      if (!dataChannel || dataChannel.readyState !== "open") {
        log("DataChannel is not open yet.");
        return;
      }
      dataChannel.send(text);
      appendChat(`Me (${boundId || myIdInput.value.trim() || "Me"})`, text);
      chatInput.value = "";
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendChatBtn.click();
      }
    });

    clearLogBtn.addEventListener("click", () => {
      logBox.textContent = "";
    });
  </script>
</body>
</html>
